<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Pizza John's</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ===== GLOBAL CSS ===== */
    :root{
      --primary:#D32F2F; --dark:#212121; --bg:#f4f4f4; --card:#ffffff;
      --yellow:#FF9800; --blue:#2196F3; --green:#4CAF50; --red:#E53935; --gray:#9E9E9E;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--dark);}
    
    /* ===== IMPORTANT: HIDE/SHOW CLASS ===== */
    .hidden { display: none !important; } 
    
    /* ===== LOGIN PAGE CSS ===== */
    .login-wrap{display:flex;justify-content:center;align-items:center;height:100vh;background:var(--dark)}
    .login-box{background:var(--card);padding:40px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
    .login-box h2{text-align:center;margin-bottom:20px;color:var(--primary)}
    .login-box input{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
    .login-box button{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
    .login-box button:hover{background:#b71c1c}
    .error{color:var(--red);text-align:center;margin-top:10px;display:none}

    /* ===== ADMIN PANEL CSS ===== */
    .navbar{background:var(--dark);color:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
    .logo{font-size:22px;font-weight:700} .logo span{color:var(--primary)}
    .btn-logout{background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;border:none;cursor:pointer}
    .btn-clear{background:#E53935;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;border:none;cursor:pointer;margin-right: 10px}
    .btn-clear:hover{background:#c62828}
    .container{max-width:1200px;margin:30px auto;padding:20px}
    .stats-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:20px;margin-bottom:30px}
    .stat-card{background:var(--card);padding:20px;border-radius:12px;display:flex;align-items:center;gap:15px;box-shadow:0 4px 15px rgba(0,0,0,0.08);border-left:5px solid var(--primary)}
    .stat-card i{font-size:32px;color:var(--primary)} .stat-card h3{font-size:28px}
    .stat-card.yellow{border-color:var(--yellow)} .stat-card.yellow i{color:var(--yellow)}
    .stat-card.blue{border-color:var(--blue)} .stat-card.blue i{color:var(--blue)}
    .stat-card.green{border-color:var(--green)} .stat-card.green i{color:var(--green)}
    .section-title{font-size:22px;margin-bottom:20px}
    .order-card{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;border-left:6px solid var(--yellow);box-shadow:0 4px 15px rgba(0,0,0,0.08)}
    .order-card.status-processing{border-color:var(--blue)} .order-card.status-onway{border-color:var(--green)} .order-card.status-ready{border-color:var(--green)} .order-card.status-delivered{border-color:var(--gray)} .order-card.status-cancelled{border-color:var(--red);opacity:0.7}
    .order-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:12px}
    .badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;margin-left:8px}
    .badge.pending{background:#FFF3E0;color:var(--yellow)} .badge.processing{background:#E3F2FD;color:var(--blue)} .badge.onway{background:#E8F5E9;color:var(--green)} .badge.ready{background:#E8F5E9;color:var(--green)} .badge.delivered{background:#F5F5F5;color:#555} .badge.cancelled{background:#FFEBEE;color:var(--red)} .badge.type{background:#607D8B;color:#fff}
    .order-body{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:14px;margin-bottom:15px}
    .order-actions{display:flex;gap:10px;flex-wrap:wrap}
    .order-actions button{padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
    .order-actions .btn-cancel{background:var(--red) !important}
    .order-actions .btn-delete{background:#555 !important}
    .order-actions button:disabled{background:#ccc !important;cursor:not-allowed}
    .empty{text-align:center;padding:50px;background:var(--card);border-radius:12px}
    @media(max-width:900px){.stats-grid{grid-template-columns:repeat(2, 1fr)} .order-body{grid-template-columns:1fr}}
    @media(max-width:600px){.stats-grid{grid-template-columns:1fr} .navbar{padding:15px}}
  </style>
</head>
<body>

<!-- ===== 1. LOGIN PAGE ===== -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h2><i class="fa-solid fa-user-shield"></i> Admin Login</h2>
    <!-- CHANGE 1: username ki jaga email -->
    <input type="email" id="email" placeholder="Enter Admin Email" required> 
    <input type="password" id="password" placeholder="Enter Password" required>
    <button onclick="login()">Login</button>
    <p class="error" id="errorMsg">Wrong Email or Password!</p>
  </div>
</div>

<!-- ===== 2. ADMIN PANEL - STARTS HIDDEN ===== -->
<div id="adminPanel" class="hidden">
  <header class="navbar">
    <div class="logo"><i class="fa-solid fa-user-shield"></i> pizza johns <span>Admin Panel</span></div>
    <div>
      <button class="btn-clear" onclick="clearAllOrders()"><i class="fa-solid fa-trash"></i> Clear ALL</button>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><i class="fa-solid fa-bag-shopping"></i><div><h3 id="total">0</h3><p>Total Orders</p></div></div>
      <div class="stat-card yellow"><i class="fa-solid fa-clock"></i><div><h3 id="pending">0</h3><p>Pending</p></div></div>
      <div class="stat-card blue"><i class="fa-solid fa-fire-burner"></i><div><h3 id="processing">0</h3><p>Processing</p></div></div>
      <div class="stat-card green"><i class="fa-solid fa-check"></i><div><h3 id="delivered">0</h3><p>Delivered</p></div></div>
    </div>

    <h2 class="section-title"><i class="fa-solid fa-list"></i> Live Orders</h2>
    <div id="ordersContainer"><div class="empty"><h2>No Orders Yet</h2><p>New orders will appear here automatically</p></div></div>
  </div>
</div>

<!-- ===== 3. FIREBASE + SCRIPT ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<!-- CHANGE 2: Auth wala script add kiya -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script> 

<script>
// ===== 1. FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyAQD6oRdYoBQNVGVpoVZDzGFRW0Y_TNShU",
  authDomain: "pizza-john-project.firebaseapp.com",
  projectId: "pizza-john-project",
  storageBucket: "pizza-john-project.firebasestorage.app",
  messagingSenderId: "180679233905",
  appId: "1:180679233905:web:63a59a4022ee11410ea6d0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth(); // CHANGE 3: Auth initialize

const TWO_HOURS = 2 * 60 * 60 * 1000; 
let allOrders = []; 

// 1. LOGIN FUNCTION - FIREBASE WALA
function login(){
  const email = document.getElementById('email').value.trim(); // username ki jaga email
  const pass = document.getElementById('password').value.trim(); 
  
  if(email === "" || pass === ""){ 
    document.getElementById('errorMsg').innerText = "Please enter both Email and Password!";
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }

  // FIREBASE LOGIN
  auth.signInWithEmailAndPassword(email, pass)
  .then((userCredential) => {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('loginPage').classList.add('hidden'); 
    document.getElementById('adminPanel').classList.remove('hidden'); 
    loadOrders(); 
  })
  .catch((error) => {
    document.getElementById('errorMsg').innerText = "Wrong Email or Password!";
    document.getElementById('errorMsg').style.display = 'block'; 
  });
}

// 2. LOGOUT FUNCTION - FIREBASE WALA
function logout(){
  auth.signOut().then(() => {
    document.getElementById('adminPanel').classList.add('hidden'); 
    document.getElementById('loginPage').classList.remove('hidden'); 
    document.getElementById('email').value = ""; // username ki jaga email
    document.getElementById('password').value = "";
  });
}

// Baaki sab code wesa hi hai
function loadOrders(){
    console.log("Firebase se orders load ho rahe hain...");
    
    db.collection("orders").onSnapshot(snapshot => {
        console.log("Data mil gaya. Total orders:", snapshot.size);
        allOrders = [];
        
        snapshot.forEach(doc => {
            let o = doc.data();
            o.firestoreId = doc.id; 
            o.id = o.time || o.timestamp || doc.id; 
            if(o.status) o.status = String(o.status).toLowerCase();
            allOrders.push(o);
        });

        allOrders.sort((a,b) => {
            let timeA = a.time || a.timestamp || 0;
            let timeB = b.time || b.timestamp || 0;
            if(timeA.seconds) timeA = timeA.seconds * 1000; 
            if(timeB.seconds) timeB = timeB.seconds * 1000;
            return timeB - timeA;
        });
        
        const now = Date.now();
        allOrders.forEach(o => {
            let orderTime = o.time || o.timestamp || 0;
            if(orderTime.seconds) orderTime = orderTime.seconds * 1000;
            
            if(o.status == 'pending' && orderTime && (now - orderTime) > TWO_HOURS){
                updateStatus(o.firestoreId, 'cancelled');
            }
        });

        displayOrders(allOrders);
    }, error => {
        console.error("FIREBASE ERROR:", error);
        alert("Firebase Error: " + error.message);
    });
}

function displayOrders(orders){
  const c = document.getElementById('ordersContainer');
  c.innerHTML = ""; 

  document.getElementById('total').innerText = orders.length;
  document.getElementById('pending').innerText = orders.filter(o=>o.status=='pending').length;
  document.getElementById('processing').innerText = orders.filter(o=>o.status=='processing').length;
  document.getElementById('delivered').innerText = orders.filter(o=>o.status=='delivered').length;

  if(orders.length==0){ 
    c.innerHTML="<div class='empty'><h2>No Orders Yet</h2><p>New orders will appear here automatically</p></div>"; 
    return; 
  }

  orders.forEach(order=>{
    let buttons = '';
    
    if(order.type == 'delivery'){
      if(order.status == 'pending') buttons += `<button onclick="updateStatus('${order.firestoreId}','processing')">Start Processing</button>`;
      if(order.status == 'processing') buttons += `<button onclick="updateStatus('${order.firestoreId}','onway')">Mark On The Way</button>`;
      if(order.status == 'onway') buttons += `<button onclick="updateStatus('${order.firestoreId}','delivered')">Mark Delivered</button>`;
    }
    if(order.type == 'pickup'){
      if(order.status == 'pending') buttons += `<button onclick="updateStatus('${order.firestoreId}','processing')">Start Processing</button>`;
      if(order.status == 'processing') buttons += `<button onclick="updateStatus('${order.firestoreId}','ready')">Mark Order Ready</button>`;
      if(order.status == 'ready') buttons += `<button onclick="updateStatus('${order.firestoreId}','delivered')">Mark Collected</button>`;
    }
    if(order.status == 'pending' || order.status == 'processing'){
      buttons += `<button class="btn-cancel" onclick="cancelOrder('${order.firestoreId}')">Cancel Order</button>`;
    }
    buttons += `<button class="btn-delete" onclick="deleteOrder('${order.firestoreId}')">Delete</button>`;
    if(order.status == 'delivered') buttons += `<button disabled>Completed</button>`;
    if(order.status == 'cancelled') buttons += `<button disabled>Cancelled</button>`;

    let timeDisplay = 'N/A';
    if(order.time) {
        let t = order.time.seconds ? order.time.seconds * 1000 : order.time;
        timeDisplay = new Date(t).toLocaleString();
    }

    c.innerHTML += `
    <div class="order-card status-${order.status}">
      <div class="order-top">
        <div>
          <h3>Order #${String(order.firestoreId).slice(-5)}</h3>
          <span class="badge ${order.status}">${getStatusText(order.status)}</span>
          <span class="badge type">${order.type}</span>
        </div>
        <small>${timeDisplay}</small>
      </div>
      <div class="order-body">
        <div><b>Customer:</b><br>${order.name}<br>${order.contact}<br>${order.location}</div>
        <div><b>Order:</b><br>
${order.items.map(item => `${item.name} x ${item.qty}`).join('<br>')}
<br><b>Total: Rs. ${order.total}</b></div>
      </div>
      <div class="order-actions">${buttons}</div>
    </div>`;
  });
}

function getStatusText(status){
  if(status == 'pending') return "Pending";
  if(status == 'processing') return "Processing";
  if(status == 'onway') return "On The Way";
  if(status == 'ready') return "Order Ready";
  if(status == 'delivered') return "Delivered";
  if(status == 'cancelled') return "Cancelled";
  return status;
}

function updateStatus(id, status){
  db.collection("orders").doc(id).update({status: status});
}

function cancelOrder(id){
  if(confirm("Cancel this order?")){
    updateStatus(id, 'cancelled');
  }
}

function deleteOrder(id){
  if(confirm("Delete this order permanently?")){
    db.collection("orders").doc(id).delete();
  }
}

function clearAllOrders(){
  if(confirm("Are you sure? This will delete ALL orders!")){
    db.collection("orders").get().then(snapshot => {
      snapshot.forEach(doc => doc.ref.delete());
    });
  }
}
</script>

</body>
</html>
