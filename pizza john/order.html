<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order - Pizza John's</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="order.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

  <style>
    /* ===== STEP 2: SHOP CLOSED BANNER CSS ===== */
  .closed-banner{
        background: #E53935; color:#fff; text-align:center; padding:15px;
        font-size:18px; font-weight:700; border-radius:10px; margin-bottom:20px;
        display:none; /* by default hidden */
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="logo"><i class="fa-solid fa-pizza-slice"></i> Pizza John's <span>Order Now</span></div>
  <a href="index.html" class="btn-home"><i class="fa-solid fa-arrow-left"></i> Back to Menu</a>
</header>

<div class="container">
  <div class="order-box">
    <h2><i class="fa-solid fa-receipt"></i> Complete Your Order</h2>

    <!-- ===== STEP 3A: SHOP CLOSED BANNER HTML ===== -->
    <div class="closed-banner" id="closedBanner">
      <i class="fa-solid fa-store-slash"></i> Pizza John's is CLOSED right now!
      <br>We are open from <span id="openTimeText"></span> to <span id="closeTimeText"></span>
    </div>

    <div id="cartItemsList"></div>

    <form id="orderForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Your Name *</label>
        <input type="text" id="name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-phone"></i> Phone Number *</label>
        <input type="tel" id="phone" required placeholder="03xx-xxxxxxx">
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-truck"></i> Order Type *</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="orderType" value="pickup" checked onchange="toggleLocation()">
            <i class="fa-solid fa-store"></i> Pick Up
          </label>
          <label class="radio-option">
            <input type="radio" name="orderType" value="delivery" onchange="toggleLocation()">
            <i class="fa-solid fa-motorcycle"></i> Home Delivery
          </label>
        </div>
      </div>

      <div class="form-group hidden" id="locationBox">
        <label><i class="fa-solid fa-location-dot"></i> Delivery Address *</label>
        <textarea id="location" rows="3" placeholder="House no, Street, Area, City"></textarea>
      </div>

      <div class="summary">
        <h3><i class="fa-solid fa-calculator"></i> Bill Summary</h3>
        <div class="summary-row"><span>Subtotal:</span> <span id="subtotal">Rs. 0</span></div>
        <div class="summary-row"><span>Delivery Fee:</span> <span id="deliveryFee">Rs. 0</span></div>
        <div class="summary-row total"><span>Total:</span> <span id="total">Rs. 0</span></div>
      </div>

      <!-- ===== BUTTON ME ID ADD KI ===== -->
      <button type="submit" id="placeOrderBtn" class="btn-submit"><i class="fa-solid fa-check"></i> Place Order Now</button>
    </form>
  </div>
</div>

<script>
// ===== STEP 1: SHOP TIMING SETTINGS =====
const SHOP_OPEN_HOUR = 8; // 0 = 12AM
const SHOP_CLOSE_HOUR = 0; // 12 = 12PM
// =========================================

// 1. FIREBASE CONFIG - YAHAN APNA CONFIG PASTE KARO
const firebaseConfig = {
  apiKey: "AIzaSyAQD6oRdYoBQNVGVpoVZDzGFRW0Y_TNShU",
  authDomain: "pizza-john-project.firebaseapp.com",
  projectId: "pizza-john-project",
  storageBucket: "pizza-john-project.firebasestorage.app",
  messagingSenderId: "180679233905",
  appId: "1:180679233905:web:63a59a4022ee11410ea6d0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2. BAQI TUMHARA CODE
const STORAGE_KEY = 'streetSpiceOrders'; // ab iski zarurat nahi, par rehne do
const DELIVERY_FEE = 0;

let cart = JSON.parse(localStorage.getItem('cart')) || [];
let groupedCart = [];
let isPlacingOrder = false; // <-- NAYA: Double click rokne ke liye

function groupCart() {
  groupedCart = [];
  cart.forEach(item => {
    let found = groupedCart.find(i => i.name === item.name);
    if(found) found.qty++;
    else groupedCart.push({...item, qty: 1});
  });
}

window.onload = () => {
  groupCart();
  loadCartItems();
  toggleLocation();
  updateShopStatus(); // ===== STEP 6A: PAGE LOAD PE CHECK =====
}
setInterval(updateShopStatus, 60000); // ===== STEP 6B: HAR 1 MIN BAAD CHECK =====

function loadCartItems() {
  const container = document.getElementById('cartItemsList');
  if(groupedCart.length === 0) {
    container.innerHTML = "<h3 style='text-align:center; padding:20px;'>Cart is empty 🛒</h3>";
    updateSummary();
    return;
  }

  container.innerHTML = groupedCart.map((item, index) => `
    <div class="selected-item-card">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="item">
      <div class="item-info">
        <h3>${item.name}</h3>
        <p>Rs. <span>${item.price}</span> each</p>
      </div>
      <div class="qty-box">
        <button type="button" onclick="changeQty(${index}, -1)">-</button>
        <input type="number" value="${item.qty}" min="1" readonly>
        <button type="button" onclick="changeQty(${index}, 1)">+</button>
      </div>
      <button type="button" class="remove-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
    </div>
  `).join('');
  updateSummary();
}

function changeQty(index, val){
  groupedCart[index].qty += val;
  if(groupedCart[index].qty < 1) groupedCart[index].qty = 1;
  cart = [];
  groupedCart.forEach(item => {
    for(let i=0; i<item.qty; i++) cart.push({name: item.name, price: item.price, qty: 1});
  });
  localStorage.setItem('cart', JSON.stringify(cart));
  loadCartItems();
}

function removeItem(index) {
  groupedCart.splice(index, 1);
  cart = [];
  groupedCart.forEach(item => {
    for(let i=0; i<item.qty; i++) cart.push({name: item.name, price: item.price, qty: 1});
  });
  localStorage.setItem('cart', JSON.stringify(cart));
  loadCartItems();
}

function toggleLocation(){
  const type = document.querySelector('input[name="orderType"]:checked').value;
  const box = document.getElementById('locationBox');
  document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('active'));
  document.querySelector(`input[value="${type}"]`).closest('.radio-option').classList.add('active');

  if(type === 'delivery'){
    box.classList.remove('hidden');
    document.getElementById('location').required = true;
  } else {
    box.classList.add('hidden');
    document.getElementById('location').required = false;
  }
  updateSummary();
}

function updateSummary(){
  let subtotal = groupedCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const type = document.querySelector('input[name="orderType"]:checked').value;
  const delivery = type === 'delivery'? DELIVERY_FEE : 0;
  const total = subtotal + delivery;

  document.getElementById('subtotal').innerText = `Rs. ${subtotal}`;
  document.getElementById('deliveryFee').innerText = `Rs. ${delivery}`;
  document.getElementById('total').innerText = `Rs. ${total}`;
}

// ===== STEP 4: SHOP TIMING FUNCTIONS =====
function isShopOpen() {
    const now = new Date();
    const currentHour = now.getHours();
    if (SHOP_OPEN_HOUR < SHOP_CLOSE_HOUR) {
        return currentHour >= SHOP_OPEN_HOUR && currentHour < SHOP_CLOSE_HOUR;
    } else { // raat wali timing ke liye
        return currentHour >= SHOP_OPEN_HOUR || currentHour < SHOP_CLOSE_HOUR;
    }
}

function formatTime(h) {
    const ampm = h >= 12? 'PM' : 'AM';
    h = h % 12; h = h? h : 12;
    return h + ampm;
}

function updateShopStatus() {
    const isOpen = isShopOpen();
    const banner = document.getElementById('closedBanner');
    const btn = document.getElementById('placeOrderBtn');

    document.getElementById('openTimeText').innerText = formatTime(SHOP_OPEN_HOUR);
    document.getElementById('closeTimeText').innerText = formatTime(SHOP_CLOSE_HOUR);

    if (!isOpen) {
        banner.style.display = 'block';
        btn.disabled = true;
        btn.innerHTML = "<i class='fa-solid fa-store-slash'></i> Shop is Closed";
        btn.style.background = "#9E9E9E";
    } else {
        banner.style.display = 'none';
        if(!isPlacingOrder){ // <-- NAYA: Sirf tab enable karo jab order process me na ho
            btn.disabled = false;
            btn.innerHTML = "<i class='fa-solid fa-check'></i> Place Order Now";
            btn.style.background = ""; // default color wapas
        }
    }
}
// =========================================

// 3. YE FUNCTION AB FIREBASE ME SAVE KAREGA + DOUBLE CLICK FIX
async function placeOrder(e){
  e.preventDefault();

  if(isPlacingOrder) return; // <-- NAYA: Agar pehle se chal raha hai to wapis mat jao

  // ===== STEP 5: ORDER SE PEHLE CHECK =====
  if (!isShopOpen()) {
        alert("Sorry! Pizza John's is closed. We open from " + formatTime(SHOP_OPEN_HOUR) + " to " + formatTime(SHOP_CLOSE_HOUR));
        return;
  }
  // =======================================

  if(groupedCart.length === 0) return alert("Cart is empty!");

  const name = document.getElementById('name').value.trim();
  const contact = document.getElementById('phone').value.trim();
  const type = document.querySelector('input[name="orderType"]:checked').value;
  const location = type === 'delivery'? document.getElementById('location').value.trim() : 'Pick-Up from Shop';

  if(!name ||!contact){ alert("Please fill Name and Phone"); return; }
  if(type === 'delivery' &&!location){ alert("Please enter delivery address"); return; }

  // ===== NAYA: BUTTON DISABLE KAR DO =====
  isPlacingOrder = true;
  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true;
  btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Placing Order...";
  btn.style.opacity = "0.7";
  btn.style.cursor = "not-allowed";
  // =======================================

  const newOrder = {
    time: firebase.firestore.FieldValue.serverTimestamp(), // Firebase time
    status: "pending",
    items: groupedCart,
    total: groupedCart.reduce((sum, item) => sum + (item.price * item.qty), 0) + (type === 'delivery'? DELIVERY_FEE : 0),
    name: name,
    contact: contact,
    type: type,
    location: location
  };

  try {
    await db.collection("orders").add(newOrder);
    alert("Order Placed Successfully!");
    localStorage.removeItem('cart'); // cart clear
    localStorage.setItem('lastCustomerContact', contact);
    window.location.href = "myorders.html";
  }
  catch(error) {
    console.error("Error saving order: ", error);
    alert("Error: " + error);

    // ===== NAYA: ERROR AAYE TO BUTTON WAPIS ENABLE =====
    isPlacingOrder = false;
    btn.disabled = false;
    btn.innerHTML = "<i class='fa-solid fa-check'></i> Place Order Now";
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
    // ===================================================
  }
}
</script>

</body>
</html>
